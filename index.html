:root[data-theme="dark"]{color-scheme:dark;--bg:#14171f;--sf:#1e232e;--tx:#ecebe6;--mu:#9aa1b2;--ac:#fb923c;--ac2:#2dd4bf;--bd:#313847;--bar:#f59e0b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,button,textarea,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}

.warn{border-left:4px solid var(--ac);padding-left:10px}

.kpi b{display:block;font-size:20px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:13px}
.hide{display:none}

function parseLines(t){
 const out=[],bad=[];
 t.split(/\n/).forEach(l=>{
  l=l.trim();if(!l)return;
  const d=l.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)||null;
  let date;
  if(d)date=`${d[1]}-${d[2].padStart(2,"0")}-${d[3].padStart(2,"0")}`;
  else{const m=l.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)date=`${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`}
  const rest=l.replace(/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}|\d{1,2}[-\/]\d{1,2}[-\/]\d{4}/,"");
  const dr=/(^|[^a-z])(e|eve|evening|noche|n)([^a-z]|$)/i.test(rest)?"E":/(^|[^a-z])(m|mid|midday|dia|día)([^a-z]|$)/i.test(rest)?"M":null;
  const digs=rest.replace(/[a-zA-Zí]+/g," ").match(/\d/g)||[];
  if(!date||!dr||digs.length<3||digs.length>4){bad.push(l);return}
  out.push({k:date+dr,d:date,t:dr,n:digs.slice(0,3).join(""),f:digs[3]??""});
 });
 return{out,bad};
}

 <div class="card"><h2>Gráfica de pastel</h2><svg viewBox="0 0 260 260" style="width:100%;max-width:300px;display:block;margin:0 auto">${paths}</svg><p class="note">Cada porción es la parte del puntaje que tiene ese número entre los 20. Porciones parecidas significan que los números están casi igualados; no es un porcentaje de probabilidad. Los colores corresponden al # de la tabla.</p></div>
 <div class="card"><h2>📖 Qué está pasando con tus datos</h2>${UL([`Para cada número del 00 al 99 se cuentan sus repeticiones en 4 casos: en total (<b>Total</b>), en el mismo día de la semana que el próximo sorteo (<b>${dw.slice(0,3)}</b>), en la misma semana del mes (<b>Sem ${wk}</b>) y en las últimas 4 semanas, 28 sorteos (<b>4 sem</b>).`,`El puntaje mezcla esos casos: 35% día de la semana, 25% semana del mes, 20% últimas 4 semanas y 20% total. Los 20 con más puntaje forman la lista.`,btx])}<b>Cómo leerlo</b>${UL(["Un puntaje alto solo significa “se ha repetido más en estos casos”, no que sea más probable.",`Matemáticamente, cada número del 00 al 99 tiene 1% de probabilidad en cada sorteo, sin importar el historial; los 20 de la lista suman 20%, igual que cualquier otro grupo de 20.`,"Para que las columnas Día y Semana tengan sentido, usa “Todo el historial” y “Solo Evening”.","Juega solo dinero que puedas permitirte perder."])}</div>
 <div class="card"><h2>Resultados oficiales</h2>${FLBTN}</div>`;
}
function impView(){
 return `<div class="card"><h2>Importar resultados</h2>
 <p class="note">Pega un sorteo por línea (se guardan los 3 dígitos, pero solo se analizan los 2 últimos): <b>fecha, M o E, y los dígitos</b> (Fireball opcional al final). Ejemplos:<br>2026-08-04 M 5 8 2 1<br>2026-08-04 E 6 5 0<br>08/03/2026 M 464</p>
 <textarea id="txt" placeholder="2026-08-04 M 5 8 2 1"></textarea>
 <div class="row" style="margin-top:8px"><button class="p" id="go">Guardar</button><button id="exp">Exportar</button><button id="seed">Cargar historial incluido</button><button id="clr">Borrar todo</button></div>
 <p class="note" id="msg"></p>
 <p class="note">Los datos oficiales están en floridalottery.com/pick3 (Past Results). Esta página no puede leer ese sitio directamente, así que los resultados se cargan aquí.</p></div>`;
}
function wireImp(){
 $("#go").onclick=async()=>{
  const {out,bad}=parseLines($("#txt").value);
  if(!out.length){$("#msg").textContent="No se reconoció ninguna línea.";return}
  const m=new Map(ROWS.map(x=>[x.k,x]));out.forEach(x=>m.set(x.k,x));
  ROWS=[...m.values()];saveLocal();
  let ok=true;
  if(db){try{
   const years={};ROWS.forEach(x=>{const y=x.d.slice(0,4);(years[y]=years[y]||[]).push(`${x.d}|${x.t}|${x.n}|${x.f}`)});
   for(const y of Object.keys(years))await db.collection("draws").doc("y"+y).set({rows:years[y]});
  }catch(e){ok=false}}
  $("#msg").textContent=`${out.length} sorteos guardados${bad.length?`, ${bad.length} líneas ignoradas`:""}${db&&!ok?" (solo en este navegador: no se pudo guardar en la base)":""}.`;
  $("#txt").value="";render2();
 };
 $("#exp").onclick=()=>{$("#txt").value=sorted().map(x=>`${x.d} ${x.t} ${[...x.n].join(" ")}${x.f!==""?" "+x.f:""}`).join("\n")};
 $("#seed").onclick=()=>{const {out}=parseLines(SEED);const m=new Map(ROWS.map(x=>[x.k,x]));out.forEach(x=>m.set(x.k,x));ROWS=[...m.values()];saveLocal();$("#msg").textContent=out.length+" sorteos del historial cargados (nov 2025 – nov 2026, Evening).";render2()};
 $("#clr").onclick=async()=>{
  if(!confirm("¿Borrar todos los datos?"))return;
  const ys=[...new Set(ROWS.map(x=>x.d.slice(0,4)))];
  ROWS=[];saveLocal();
  if(db){try{for(const y of ys)await db.collection("draws").doc("y"+y).set({rows:[]})}catch(e){}}
  render();
 };
}
function render2(){const m=$("#msg")?.textContent;render();if(tab==="imp"&&m)$("#msg").textContent=m}
function fromSnap(s){
 const m=new Map();
 s.docs.forEach(d=>{(d.data()?.rows||[]).forEach(r=>{const [dt,t,n,f]=r.split("|");m.set(dt+t,{k:dt+t,d:dt,t,n,f})})});
 if(m.size){ROWS=[...m.values()];saveLocal();render()}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b){tab=b.dataset.t;render()}});
$("#fDraw").onchange=$("#fRange").onchange=render;
load();render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></main></body></html>
